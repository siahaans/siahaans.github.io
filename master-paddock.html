<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Master Paddock</title>
<style>
:root{--bg:#e9ebef;--paper:#fff;--ink:#111;--mute:#5b6270;--line:#c9cdd4;--head:#1f3a73;--grey:#f1f3f6;--inp:#fff;--hl:#fff8c6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#15171b;--paper:#1e2127;--ink:#e8e8e8;--mute:#9aa0aa;--line:#3a3f48;--head:#2c4f94;--grey:#262a31;--inp:#1e2127;--hl:#4a4520}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 Arial,Helvetica,sans-serif;padding:10px}
[hidden]{display:none!important}
.top{max-width:960px;margin:0 auto 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top #who{margin-right:auto;color:var(--mute);font-size:13px}
button{padding:7px 12px;border:1px solid var(--line);background:var(--head);color:#fff;border-radius:4px;cursor:pointer;font:inherit;font-size:13px}
button.g{background:var(--paper);color:var(--ink)}
.paper{max-width:960px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px}
h1{margin:0 0 12px;font-size:20px}
.tools{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:12px}
.tools input,.tools select{width:100%;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:4px;background:var(--inp);color:var(--ink);font:inherit}
.tools input:focus,.tools select:focus{outline:2px solid #4da3ff;outline-offset:-1px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.st{flex:1 1 140px;padding:10px 12px;background:var(--grey);border-radius:6px}
.st b{display:block;font-size:20px}.st small{color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th{background:var(--head);color:#fff;text-align:left;padding:8px 10px;font-size:13px;cursor:pointer;user-select:none;white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:7px 10px;border-bottom:1px solid var(--line)}
tbody tr:nth-child(even){background:var(--grey)}
mark{background:var(--hl);color:inherit;padding:0 1px;border-radius:2px}
#msg{margin:10px 0 0;color:var(--mute);font-size:13px}
@media(max-width:640px){.tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}.tools button{grid-column:1/-1}}
</style>
</head>
<body>
<p id="ld" style="text-align:center;padding:30px">Memuat...</p>
<div id="app" hidden>
 <div class="top"><span id="who"></span><button class="g" id="bHome">&larr; Beranda</button><button class="g" id="bWO">Work Order</button><button class="g" id="bOut">Keluar</button></div>
 <div class="paper">
  <h1>Master Paddock</h1>
  <div class="tools">
   <input id="q" type="search" placeholder="Cari paddock, varietas, atau status..." autocomplete="off">
   <select id="fv"><option value="">Semua varietas</option></select>
   <select id="fs"><option value="">Semua status</option></select>
   <button class="g" id="bReset">Reset</button>
  </div>
  <div class="stats">
   <div class="st"><b id="sN">-</b><small>Jumlah paddock</small></div>
   <div class="st"><b id="sL">-</b><small>Total luas (Ha)</small></div>
  </div>
  <div class="scroll"><table>
   <thead><tr><th data-k="paddock">Paddock<i></i></th><th data-k="varietas">Varietas<i></i></th><th data-k="status">Status<i></i></th><th data-k="luas" class="r">Luasan (Ha)<i></i></th></tr></thead>
   <tbody id="tb"></tbody>
  </table></div>
  <p id="msg"></p>
 </div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getAuth,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {loadPaddocks,searchPaddocks,distinct,totalLuas,fmtLuas} from "./paddock.js";

const cfg={apiKey:"AIzaSyDEsM1oAvOw_7Zd14wd2SmlnOAqAgwbQIU",authDomain:"gpa---work-order.firebaseapp.com",projectId:"gpa---work-order",storageBucket:"gpa---work-order.firebasestorage.app",messagingSenderId:"352208521958",appId:"1:352208521958:web:895d25863e8ec918070927"};
const $=id=>document.getElementById(id);
const auth=getAuth(initializeApp(cfg));
const MAX=500;
let all=[],sortK=null,sortD=1,timer;

onAuthStateChanged(auth,async u=>{
 if(!u){location.replace('index.html');return}
 $('who').textContent=u.email;
 try{
  all=await loadPaddocks();
  fill($('fv'),distinct(all,'varietas'));fill($('fs'),distinct(all,'status'));
  $('ld').hidden=true;$('app').hidden=false;render();$('q').focus();
 }catch(e){$('ld').textContent='Gagal memuat paddock.csv: '+e.message+'. Pastikan file paddock.csv ada di folder yang sama.'}
});

function fill(sel,arr){arr.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o)})}

function hl(td,text,terms){
 const low=text.toLowerCase();let pos=0;
 const hits=[];
 terms.forEach(t=>{let i=low.indexOf(t);if(i>-1)hits.push([i,i+t.length])});
 hits.sort((a,b)=>a[0]-b[0]);
 hits.forEach(([s,e])=>{if(s<pos)return;td.append(text.slice(pos,s));const m=document.createElement('mark');m.textContent=text.slice(s,e);td.append(m);pos=e});
 td.append(text.slice(pos));
}

function render(){
 const q=$('q').value,fv=$('fv').value,fs=$('fs').value;
 const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
 let res=searchPaddocks(all,q).filter(it=>(!fv||it.varietas===fv)&&(!fs||it.status===fs));
 if(sortK)res=res.slice().sort((a,b)=>{
  const x=a[sortK],y=b[sortK];
  if(sortK==='luas')return((x||0)-(y||0))*sortD;
  return String(x).localeCompare(String(y),'id',{numeric:true})*sortD;
 });
 $('sN').textContent=res.length.toLocaleString('id-ID');
 $('sL').textContent=fmtLuas(totalLuas(res))||'0';
 const tb=$('tb'),fr=document.createDocumentFragment();
 res.slice(0,MAX).forEach(it=>{
  const tr=document.createElement('tr');
  ['paddock','varietas','status'].forEach(k=>{const td=document.createElement('td');hl(td,it[k]||'',terms);tr.appendChild(td)});
  const l=document.createElement('td');l.className='r';l.textContent=fmtLuas(it.luas);tr.appendChild(l);
  fr.appendChild(tr);
 });
 tb.replaceChildren(fr);
 $('msg').textContent=!res.length?'Tidak ada paddock yang cocok.':res.length>MAX?'Menampilkan '+MAX+' dari '+res.length+' paddock. Persempit pencarian untuk melihat sisanya.':'';
 document.querySelectorAll('th').forEach(th=>{th.querySelector('i').textContent=th.dataset.k===sortK?(sortD>0?' \u25B2':' \u25BC'):''});
}

$('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(render,120)});
$('fv').onchange=$('fs').onchange=render;
$('bReset').onclick=()=>{$('q').value='';$('fv').value='';$('fs').value='';sortK=null;sortD=1;render();$('q').focus()};
document.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;sortD=sortK===k?-sortD:1;sortK=k;render()});
$('bHome').onclick=()=>{location.href='index.html'};
$('bWO').onclick=()=>{location.href='work-order.html'};
$('bOut').onclick=()=>signOut(auth);
</script>
</body>
</html>
